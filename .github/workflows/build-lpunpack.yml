name: build-lpunpack

on:
  workflow_dispatch:

env:
  URL: https://github.com/soe1hom-arch/lpunpack-go/archive/refs/tags/v1.0.7.tar.gz
  VER: 1.0.7

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: 下载并解包源码
        run: |
          curl -fsSL -o src.tar.gz "$URL"
          mkdir src
          tar xzf src.tar.gz -C src --strip-components=1

      - name: 交叉编译
        working-directory: src
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          name="lpunpack-${VER}-${GOOS}-${GOARCH}${ext}"
          go build -ldflags="-s -w" -o "$name" .
          echo "BIN=$name" >> "$GITHUB_ENV"

      - name: 计算校验和
        working-directory: src
        run: sha256sum "$BIN" > "$BIN.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lpunpack-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            src/${{ env.BIN }}
            src/${{ env.BIN }}.sha256

