name: build cross-compile tools

run-name: ${{ github.event.inputs.run_name || format('{0}-{1}', github.event.inputs.tool_name, github.event.inputs.tool_version) }}

on:
  workflow_dispatch:
    inputs:
      run_name:
        description: run name
        default: ''
        required: false

      tool_name:
        description: tool name
        default: xz
        required: true

      tool_version:
        description: version
        default: 5.8.3
        required: true

      source_url:
        description: source url
        default: https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz
        required: true

      targets:
        description: targets
        default: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,i686-unknown-linux-musl,arm-unknown-linux-musleabi
        required: true

      build_command:
        description: build command
        default: |
          ./configure --host="${TC}" --prefix=/usr --disable-shared --enable-static LDFLAGS="-static"
          make -j$(nproc)
          make install DESTDIR="${INST}"
        required: true


env:

  TOOLCHAIN_TAG: 2026-06-30-14-51

  TOOLCHAIN_BASE: https://github.com/uxhzbaz/musl-cross/releases/download/2026-06-30-14-51


jobs:


  prepare:

    runs-on: ubuntu-24.04

    outputs:

      source: source.tar


    steps:


      - name: download source

        run: |

          mkdir source

          curl -fL \
          --retry 10 \
          --retry-all-errors \
          "${{github.event.inputs.source_url}}" \
          -o source/archive


          file source/archive


          case "$(file -b source/archive)" in

          *Zip*)
            unzip -q source/archive -d source/unpack
            ;;

          *)
            tar -tf source/archive >/dev/null
            ;;

          esac


      - uses: actions/upload-artifact@v4.6.2

        with:

          name: source

          path: source/archive

          retention-days: 1




  parse:


    runs-on: ubuntu-24.04


    outputs:

      matrix: ${{steps.p.outputs.matrix}}


    steps:


      - id: p

        env:

          TARGETS: ${{github.event.inputs.targets}}


        run: |

          echo "$TARGETS" |
          tr ',' '\n' |
          sed '/^$/d' |
          jq -R -s -c '
          split("\n")
          |map({t:.,tc_triple:.,
          tc_url:"https://github.com/uxhzbaz/musl-cross/releases/download/2026-06-30-14-51/\(.).tar.xz"})
          |{include:.}
          ' > matrix.json


          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT




  build:


    needs:

      - prepare

      - parse


    runs-on: ubuntu-24.04


    strategy:

      fail-fast: false

      matrix: ${{fromJSON(needs.parse.outputs.matrix)}}


    steps:


      - name: apt cache

        uses: awalsh128/cache-apt-pkgs-action@latest

        with:

          packages: gettext unzip file

          version: 2




      - uses: actions/download-artifact@v4.3.0

        with:

          name: source

          path: .




      - name: toolchain cache

        id: tc

        uses: actions/cache@v4.2.3

        with:

          path: toolchain

          key: musl-${{matrix.tc_triple}}-${{env.TOOLCHAIN_TAG}}




      - name: download toolchain

        if: steps.tc.outputs.cache-hit != 'true'

        run: |

          mkdir toolchain


          curl -fL \
          --retry 10 \
          --retry-all-errors \
          "${{matrix.tc_url}}" \
          -o tc.tar.xz


          file tc.tar.xz | grep "XZ compressed" || exit 1


          tar xf tc.tar.xz \
          -C toolchain \
          --strip-components=1



      - name: extract source

        run: |

          mkdir src


          case "$(file -b archive)" in

          *Zip*)

            unzip -q archive -d src/tmp

            mv src/tmp/*/* src 2>/dev/null || mv src/tmp/* src

            ;;


          *)

            tar xf archive \
            -C src \
            --strip-components=1

            ;;

          esac




      - name: build


        shell: bash


        run: |

          set -e


          export TC="${{matrix.tc_triple}}"

          export INST="$GITHUB_WORKSPACE/install"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"


          export CC="${TC}-gcc"

          export CXX="${TC}-g++"

          export AR="${TC}-ar"

          export RANLIB="${TC}-ranlib"

          export STRIP="${TC}-strip"


          export CFLAGS="-Os"

          export PKG_CONFIG=false


          mkdir -p "$INST"


          cd src


          ${{github.event.inputs.build_command}}





      - name: collect


        run: |

          mkdir dist


          find install/usr/bin \
          -type f \
          -print0 |
          while IFS= read -r -d '' f

          do

            if file "$f" | grep -q ELF

            then

              "$GITHUB_WORKSPACE/toolchain/bin/${{matrix.tc_triple}}-strip" "$f" || true

              cp "$f" dist/

            fi


          done



          find dist -type f





      - name: static check


        run: |

          fail=0


          for f in dist/*

          do

            if file "$f" | grep -q ELF

            then

              file "$f" | grep "statically linked" || fail=1

            fi

          done


          exit $fail





      - name: package


        run: |

          name="${{github.event.inputs.tool_name}}-${{github.event.inputs.tool_version}}-${{matrix.t}}"


          tar -cJf "$name.tar.xz" -C dist .


          sha256sum "$name.tar.xz" \
          | awk '{print $1}' \
          > "$name.tar.xz.sha256.txt"





      - uses: actions/upload-artifact@v4.6.2

        with:

          name: ${{matrix.t}}

          path:

            |

              *.tar.xz

              *.sha256.txt




  release:


    needs: build


    runs-on: ubuntu-24.04


    permissions:

      contents: write



    steps:



      - uses: actions/download-artifact@v4.3.0

        with:

          path: release

          merge-multiple: true



      - name: checksum


        run: |

          echo "| File | SHA256 |" > RELEASE.md

          echo "|---|---|" >> RELEASE.md


          for i in release/*.sha256.txt

          do

            echo "| $(basename "$i" .sha256.txt) | $(cat "$i") |" >> RELEASE.md

          done




      - name: release


        env:

          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

          TAG: ${{github.event.inputs.tool_name}}-${{github.event.inputs.tool_version}}


        run: |


          if ! gh release view "$TAG" >/dev/null 2>&1

          then

            gh release create "$TAG" \
            --title "$TAG" \
            -F RELEASE.md

          fi



          gh release upload "$TAG" \
          release/*.tar.xz \
          --clobber



          gh release edit "$TAG" \
          -F RELEASE.md
