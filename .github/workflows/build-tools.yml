name: build cross-compile tools

run-name: ${{ github.event.inputs.run_name || format('{0}-{1}', github.event.inputs.tool_name, github.event.inputs.tool_version) }}

on:
  workflow_dispatch:
    inputs:
      run_name:
        default: ''
        required: false
      tool_name:
        default: mscp
        required: true
      tool_version:
        default: 0.2.4
        required: true
      source_url:
        default: https://github.com/upa/mscp/releases/download/v0.2.4/mscp-0.2.4.tar.gz
        required: true
      targets:
        default: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,i686-unknown-linux-musl,arm-unknown-linux-musleabi
        required: true
      build_command:
        default: |
          mkdir build
          cd build
          cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_C_COMPILER="${CC}" \
          -DCMAKE_FIND_ROOT_PATH="${INST}/deps/usr" \
          -DCMAKE_PREFIX_PATH="${INST}/deps/usr" \
          -DOPENSSL_ROOT_DIR="${INST}/deps/usr" \
          -DZLIB_ROOT="${INST}/deps/usr" \
          -DCMAKE_EXE_LINKER_FLAGS="-static" \
          -DBUILD_STATIC=ON \
          -DCMAKE_INSTALL_PREFIX=/usr
          make -j$(nproc)
          make install DESTDIR="${INST}"
        required: true


env:
  TOOLCHAIN_TAG: 2026-06-30-14-51
  TOOLCHAIN_BASE: https://github.com/uxhzbaz/musl-cross/releases/download/2026-06-30-14-51


jobs:

  prepare:

    runs-on: ubuntu-24.04

    steps:

      - name: download
        run: |

          mkdir deps

          curl -fL --retry 10 --retry-delay 5 \
          https://zlib.net/fossils/zlib-1.3.1.tar.gz \
          -o deps/zlib.tar.gz

          curl -fL --retry 10 --retry-delay 5 \
          https://github.com/openssl/openssl/releases/download/openssl-3.3.2/openssl-3.3.2.tar.gz \
          -o deps/openssl.tar.gz


          file deps/*

          file deps/zlib.tar.gz | grep gzip

          file deps/openssl.tar.gz | grep gzip


      - uses: actions/upload-artifact@v4.6.2
        with:
          name: deps
          path: deps
          retention-days: 1



  matrix:

    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.x.outputs.matrix }}

    steps:

      - id: x

        run: |

          echo '${{ github.event.inputs.targets }}' |
          tr ',' '\n' |
          jq -R -s -c '
          split("\n")
          |map(select(length>0))
          |map({t:.,tc_triple:.})
          |{include:.}
          ' > matrix.json

          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT



  build:

    needs:
      - prepare
      - matrix

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix: ${{fromJSON(needs.matrix.outputs.matrix)}}


    steps:


      - uses: actions/download-artifact@v4.3.0
        with:
          name: deps
          path: deps



      - name: toolchain cache

        uses: actions/cache@v4.2.3

        id: tc

        with:

          path: toolchain

          key: toolchain-${{matrix.tc_triple}}-${{env.TOOLCHAIN_TAG}}



      - name: toolchain download

        if: steps.tc.outputs.cache-hit != 'true'

        run: |

          mkdir toolchain

          url="${TOOLCHAIN_BASE}/${{matrix.tc_triple}}.tar.xz"


          curl -fL \
          --retry 10 \
          --retry-all-errors \
          "$url" \
          -o tc.tar.xz


          file tc.tar.xz

          file tc.tar.xz | grep -q 'XZ compressed' || exit 1


          tar -xf tc.tar.xz \
          -C toolchain \
          --strip-components=1



      - name: source

        run: |

          curl -fL \
          --retry 10 \
          --retry-all-errors \
          "${{github.event.inputs.source_url}}" \
          -o src.tar


          mkdir src

          tar -xf src.tar \
          -C src \
          --strip-components=1



      - name: build

        run: |

          export TC="${{matrix.tc_triple}}"

          export INST="$GITHUB_WORKSPACE/install"

          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"


          export CC="${TC}-gcc"
          export CXX="${TC}-g++"
          export AR="${TC}-ar"
          export RANLIB="${TC}-ranlib"
          export STRIP="${TC}-strip"


          mkdir -p "$INST"


          rm -rf /tmp/zlib

          mkdir /tmp/zlib

          tar -xf deps/zlib.tar.gz \
          -C /tmp/zlib \
          --strip-components=1


          (
          cd /tmp/zlib

          CC=$CC \
          AR=$AR \
          RANLIB=$RANLIB \
          ./configure \
          --static \
          --prefix=/usr


          make -j$(nproc)

          make install DESTDIR=$INST/deps

          )



          rm -rf /tmp/openssl

          mkdir /tmp/openssl


          tar -xf deps/openssl.tar.gz \
          -C /tmp/openssl \
          --strip-components=1



          case "$TC" in
          x86_64-*) OSSL=linux-x86_64;;
          aarch64-*) OSSL=linux-aarch64;;
          i686-*) OSSL=linux-x86;;
          arm-*) OSSL=linux-armv4;;
          esac



          (
          cd /tmp/openssl


          ./Configure \
          $OSSL \
          no-shared \
          no-tests \
          no-threads \
          CC=$CC \
          AR=$AR \
          RANLIB=$RANLIB \
          --prefix=/usr


          make -j$(nproc)

          make install_sw DESTDIR=$INST/deps

          )


          cd src

          ${{github.event.inputs.build_command}}



      - name: package

        run: |

          mkdir dist


          find install/usr/bin \
          -type f \
          -exec file {} \; |
          grep ELF |
          cut -d: -f1 |
          while read f
          do
            ${{matrix.tc_triple}}-strip "$f" || true
            cp "$f" dist/
          done


          name="${{github.event.inputs.tool_name}}-${{github.event.inputs.tool_version}}-${{matrix.t}}"


          tar -cJf "$name.tar.xz" -C dist .


          sha256sum "$name.tar.xz" \
          > "$name.tar.xz.sha256"



      - uses: actions/upload-artifact@v4.6.2

        with:

          name: ${{matrix.t}}

          path: |
            *.tar.xz
            *.sha256



  release:


    needs: build

    runs-on: ubuntu-24.04


    permissions:

      contents: write


    steps:


      - uses: actions/download-artifact@v4.3.0

        with:

          path: release

          merge-multiple: true



      - name: release

        env:

          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

        run: |

          tag="${{github.event.inputs.tool_name}}-${{github.event.inputs.tool_version}}"


          gh release create "$tag" \
          --title "$tag" \
          --notes "build"


          gh release upload "$tag" \
          release/*.tar.xz \
          release/*.sha256 \
          --clobber
